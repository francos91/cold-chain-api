name: Cold Chain Logistics CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f dashboard/requirements.txt ]; then pip install -r dashboard/requirements.txt; fi
        if [ -f Backend/requirements.txt ]; then pip install -r Backend/requirements.txt; fi
        pip install fastapi uvicorn httpx pytest flake8

    - name: Lint Code with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests with Pytest
      env:
        SUPABASE_URL: "https://mock-supabase-url.supabase.co"
        SUPABASE_KEY: "mock-supabase-key-for-ci"
      run: |
        pytest tests/
